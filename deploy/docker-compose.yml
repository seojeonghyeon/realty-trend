# 운영 배포용 (GitHub Actions → NAS). 로컬/단독 실행은 저장소 루트의 docker-compose.yml 사용.
# DB 는 NAS 의 MariaDB 패키지를 host.docker.internal 로 사용 (DATABASE_URL secret).
x-app: &app
  image: ${DOCKER_USERNAME}/realty-trend:${APP_VERSION:-latest}
  restart: unless-stopped   # 직접 stop 한 이전 색은 재부팅 후에도 꺼진 채 유지
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  mem_limit: 512m

services:
  # 1. API/웹 (FastAPI) — blue/green 무중단 교체
  blue:
    <<: *app
    container_name: realty-blue
  green:
    <<: *app
    container_name: realty-green

  # 2. 수집기 (supercronic: 백필·백업·일일 수집·법정동코드 갱신)
  collector:
    <<: *app
    container_name: realty-collector
    command: ["supercronic", "-passthrough-logs", "/app/scripts/crontab"]
    volumes:
      - ../backup:/backup

  # 3. Web Server (Nginx) — Synology 리버스 프록시(HTTPS)가 이 포트를 바라봄
  realty-nginx:
    image: nginx:1.27.0-alpine
    container_name: realty-nginx
    restart: unless-stopped
    # 최초 생성 시에만 active.conf 를 INITIAL_COLOR 로 연결. 재시작/재부팅 때는 마지막 전환 상태 유지
    command: >
      /bin/sh -c "
        mkdir -p /etc/nginx/conf.d &&
        rm -f /etc/nginx/conf.d/default.conf &&
        ( [ -e /etc/nginx/conf.d/active.conf ] || ln -sfn /etc/nginx/${INITIAL_COLOR:-blue}.conf /etc/nginx/conf.d/active.conf ) &&
        nginx -g 'daemon off;'
      "
    ports:
      - "${REALTY_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./blue.conf:/etc/nginx/blue.conf:ro
      - ./green.conf:/etc/nginx/green.conf:ro
