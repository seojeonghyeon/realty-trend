name: realty-trend deploy (manual)

# GitHub 계정 결제 문제로 Actions 가 막혀 있어 push 자동 실행을 끔. 평소에는 scripts/deploy_manual.sh 로 배포.
# 풀리면 아래 push 트리거를 다시 켜면 된다.
on:
  # push:
  #   branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-realty
  cancel-in-progress: false

env:
  IMAGE_NAME: realty-trend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # VERSION 파일 + 커밋 SHA → 매 푸시마다 고유 태그 (VERSION 을 안 올려도 새 이미지가 배포됨)
      - name: Read VERSION file
        id: get_version
        run: |
          VERSION=$(cat VERSION | xargs)
          TAG="${VERSION}-${GITHUB_SHA::7}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Detected version: $TAG"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 1. 테스트 (실패하면 배포 중단)
      - name: Test
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      # 2. Docker 이미지 빌드 및 푸시
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  copy-files:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deploy/docker-compose.yml,deploy/deploy.sh,deploy/switch.sh,deploy/nginx.conf,deploy/blue.conf,deploy/green.conf"
          target: ${{ vars.DEPLOY_DIR || '/var/services/homes/realty' }}

  deploy:
    needs: [copy-files, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to NAS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/services/homes/realty' }}
          APP_VERSION: ${{ needs.build-and-push.outputs.app_version }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          REALTY_PORT: ${{ vars.REALTY_PORT || '8000' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          command_timeout: 20m
          # 비밀값을 스크립트 본문에 끼워 넣지 않고 환경변수로 전달 (특수문자 안전)
          envs: DEPLOY_DIR,APP_VERSION,DOCKER_USERNAME,DATABASE_URL,SECRET_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,ROUTINE_TOKEN,MOLIT_SERVICE_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,KAKAO_REST_KEY,PUBLIC_BASE_URL,REALTY_PORT
          script: |
            set -e
            export PATH=$PATH:/usr/local/bin
            # 1. deploy 폴더로 이동 (copy-files 단계에서 deploy/ 아래에 저장됨)
            cd "$DEPLOY_DIR/deploy"
            chmod +x deploy.sh switch.sh

            # 2. .env 생성 (KEY=VALUE, 권한 600)
            umask 077
            {
              printf 'APP_VERSION=%s\n' "$APP_VERSION"
              printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME"
              printf 'REALTY_PORT=%s\n' "$REALTY_PORT"
              printf 'TZ=Asia/Seoul\n'
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
              printf 'ADMIN_USERNAME=%s\n' "$ADMIN_USERNAME"
              printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
              printf 'ROUTINE_TOKEN=%s\n' "$ROUTINE_TOKEN"
              printf 'MOLIT_SERVICE_KEY=%s\n' "$MOLIT_SERVICE_KEY"
              printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
              printf 'TELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_CHAT_ID"
              printf 'KAKAO_REST_KEY=%s\n' "$KAKAO_REST_KEY"
              printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
              printf 'COOKIE_SECURE=true\n'
            } > .env
            echo "APP_VERSION: $APP_VERSION"

            # 3. 배포 스크립트 실행 (blue/green)
            ./deploy.sh
